<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#123D8F"/>
      <stop offset="1" stop-color="#18C9A3"/>
    </linearGradient>
  </defs>

  <!-- Outer forecast ring -->
  <path d="M424 132a184 184 0 1 0 42 184"
        fill="none" stroke="url(#g)" stroke-width="24"
        stroke-linecap="round"/>

  <!-- Rising bars -->
  <rect x="92" y="286" width="48" height="108" rx="9" fill="#123D8F"/>
  <rect x="164" y="230" width="48" height="164" rx="9" fill="#1764B8"/>
  <rect x="236" y="174" width="48" height="220" rx="9" fill="#2295C2"/>
  <rect x="308" y="118" width="48" height="276" rx="9" fill="#20B9AE"/>

  <!-- Growth line -->
  <path d="M72 386 L116 346 L184 372 L260 292 L306 316 L386 236 L430 186"
        fill="none" stroke="url(#g)" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow head -->
  <path d="M401 181 L438 176 L433 213 Z" fill="#18C9A3"/>

  <!-- Forecast nodes -->
  <circle cx="116" cy="346" r="13" fill="#123D8F"/>
  <circle cx="184" cy="372" r="13" fill="#1764B8"/>
  <circle cx="260" cy="292" r="13" fill="#2295C2"/>
  <circle cx="386" cy="236" r="13" fill="#18C9A3"/>

  <!-- Magnifying glass -->
  <circle cx="354" cy="350" r="76" fill="white" stroke="#123D8F" stroke-width="20"/>
  <path d="M408 404 L457 453" fill="none" stroke="#123D8F"
        stroke-width="25" stroke-linecap="round"/>

  <!-- Mini chart inside magnifier -->
  <rect x="316" y="362" width="17" height="35" rx="3" fill="#1764B8"/>
  <rect x="342" y="344" width="17" height="53" rx="3" fill="#2295C2"/>
  <rect x="368" y="322" width="17" height="75" rx="3" fill="#20B9AE"/>
  <path d="M312 351 Q340 344 358 327 T395 294"
        fill="none" stroke="#18C9A3" stroke-width="8"
        stroke-linecap="round" stroke-dasharray="13 13"/>
</svg>